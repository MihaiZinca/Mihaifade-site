services:
  postgres:
    image: postgres:16
    container_name: mihaifade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mihaifade
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - mihaifade_postgres_data:/var/lib/postgresql/data

volumes:
  mihaifade_postgres_data: