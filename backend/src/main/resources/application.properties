spring.application.name=mihaifade-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mihaifade}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

app.owner.email=${OWNER_EMAIL}
app.owner.password=${OWNER_PASSWORD}
app.owner.first-name=${OWNER_FIRST_NAME:Mihai}
app.owner.last-name=${OWNER_LAST_NAME:Fade}

app.google.client-id=${GOOGLE_CLIENT_ID}

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

spring.config.import=optional:file:.env[.properties]

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}